name: Sync from upstream ARIS

on:
  schedule:
    - cron: "17 19 * * *"   # daily, 03:17 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream ARIS
        run: git clone --depth 1 https://github.com/wanshuiyin/Auto-claude-code-research-in-sleep.git "$RUNNER_TEMP/aris"

      - name: Build mirror
        run: python3 scripts/build_mirror.py --upstream "$RUNNER_TEMP/aris" --out .

      - name: Sanity check
        run: |
          test "$(find aris-claude -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -gt 50
          test "$(find aris-codex -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -gt 50
          ! grep -rq "\.\./shared-references/" aris-claude aris-codex

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A aris-claude aris-codex UPSTREAM.json INDEX.json
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            sha=$(python3 -c "import json;print(json.load(open('UPSTREAM.json'))['commit'][:12])")
            git commit -m "sync: ARIS upstream ${sha}"
            git push
          fi
